# 品种规格表（期权策略引擎的"规则底座"）
#
# 说明：
# - 所有数值请在上线前对照交易所最新《期权合约》与《交易细则》逐项核对，
#   verified: false 表示尚未人工核对，仅作开发/演示用。
# - strike_steps 只用于 demo/回放时生成合成期权链；接入真实行情后，行权价以行情里实际挂牌合约为准。
# - last_trade_rule 用于估算期权到期日（计算剩余期限 T），真实到期日以合约行情字段 expire_datetime 为准。
#   * czce : 标的期货交割月份前一个月的第 3 个交易日
#   * dce  : 标的期货交割月份前一个月的第 5 个交易日
#   * shfe : 标的期货交割月份前一个月的倒数第 5 个交易日（上期所 / 上期能源）
# - option_style: 国内商品期权均为美式（american），股指 / ETF 期权为欧式。
# - 组合保证金：三大商品交易所均支持 备兑、牛/熊市价差、跨式/宽跨式 等组合保证金优惠，
#   具体优惠口径见各交易所《期权组合保证金业务指南》，margin_combo 仅为开关提示。

